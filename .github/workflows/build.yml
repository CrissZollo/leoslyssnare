name: Build apps (macOS, Windows and Linux)

# Every merge to main builds all three versions. Download them from the run's Artifacts.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "Sources/**"
      - "Support/**"
      - "Package.swift"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version matches the release tag
        # The release files are named after the versions in the code, not the tag.
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          DESKTOP=$(python -c "import leoslyssnare; print(leoslyssnare.__version__)")
          MAC=$(/usr/bin/sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' ../Support/Info.plist)
          echo "Tag $TAG · desktop/leoslyssnare/__init__.py $DESKTOP · Support/Info.plist $MAC"
          if [ "$DESKTOP" != "$TAG" ] || [ "$MAC" != "$TAG" ]; then
            echo "::error::Set the version to $TAG in desktop/leoslyssnare/__init__.py and Support/Info.plist before tagging."
            exit 1
          fi
      - name: System packages
        # The libraries Qt needs to start, so the window tests run instead of failing to import.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  linux:
    needs: test
    # The oldest supported Ubuntu LTS, so the AppImage runs on it and anything newer.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        # ALSA headers for PortAudio, plus the X11 libraries Qt needs, so they get bundled.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev libegl1 libgl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxcb-xinerama0 libxcb-image0 \
            libxcb-render-util0 libxcb-randr0 libxcb-shape0
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Self-test the AppImage
        run: QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./build/Leos_Lyssnare-x86_64.AppImage --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Leos_Lyssnare-linux-x86_64-AppImage
          path: desktop/build/Leos_Lyssnare-x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build
        run: ./packaging/build-windows.ps1
      - name: Self-test the build
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LEOSLYSSNARE_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "build\windows\dist\LeosLyssnare\LeosLyssnare.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Leos_Lyssnare-windows-x64
          path: |
            desktop/build/*-setup.exe
            desktop/build/*.zip
          if-no-files-found: error

  macos:
    # Apple Silicon runner, so the app is built for arm64 like scripts/build-app.sh expects.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build the app
        run: ./scripts/build-app.sh
      - name: Check the app
        run: |
          codesign --verify --deep --strict --verbose=2 "build/Leos Lyssnare.app"
          file "build/Leos Lyssnare.app/Contents/MacOS/LeosLyssnare" | grep -q arm64
      - name: Zip
        # ditto keeps the executable bit and the signature; upload-artifact on its own would drop them.
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Support/Info.plist)
          ditto -c -k --keepParent "build/Leos Lyssnare.app" "build/Leos_Lyssnare-$VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Leos_Lyssnare-macos-arm64
          path: build/*-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
